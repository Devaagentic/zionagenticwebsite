[build]
  publish = "."

# Keep the service worker itself always fresh so app updates roll out
# to visitors right away instead of being stuck behind a stale cache.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "no-cache"

# Icons rarely change, so let browsers cache them longer.
[[headers]]
  for = "/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
